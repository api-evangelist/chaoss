specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: CHAOSS
providerId: chaoss
created: '2026-05-04'
generated: '2026-09-05'
modified: '2026-09-05'
method: searched
source: >-
  https://www.chaoss.community/ and its full page sitemap (https://www.chaoss.community/page-sitemap.xml),
  https://www.chaoss.community/software/, https://www.chaoss.community/governance/,
  https://docs.collectoss.org/en/latest/ and https://github.com/chaoss/CollectOSS — all read
  2026-09-05. No pricing, plans, tiers, quota or billing page exists on any CHAOSS property.
description: >-
  CHAOSS publishes NO plans and NO pricing. This is a recorded measurement, not a missing artifact.
  CHAOSS is a Linux Foundation project; its software is free software (CollectOSS is MIT, GrimoireLab
  is GPL-3.0-or-later) and is self-hosted by the adopter. There is no CHAOSS-operated API to meter,
  no account to open, and nothing to buy.
plan_count: 0
plans: []
pricing_page: null
billing_model: none
commercial: false
funding_model: >-
  Linux Foundation project funding — member organizations, sponsors and grants. CollectOSS credits
  its funders at https://github.com/chaoss/CollectOSS/blob/main/CREDITS.md.
cost_to_operator: >-
  The real cost of running CollectOSS falls on the adopter, not on CHAOSS: PostgreSQL, RabbitMQ,
  Redis and worker capacity, plus GitHub/GitLab API quota. The CLI config takes a
  --github_api_key (COLLECTOSS_GITHUB_API_KEY) and the CHAOSS software page names "support for
  rotating API keys" as a CollectOSS feature, which is a direct acknowledgement that forge rate
  limits, not CHAOSS pricing, are the binding constraint at scale.
commercial_alternatives:
  note: >-
    Third parties do sell CHAOSS-metric services, but they are separate companies and their pricing
    must never be attributed to CHAOSS.
supersedes: >-
  REPLACES a fabricated scaffold. The prior version of this file (generated 2026-05-04 by a bulk
  sweep, see roadmap#35) invented three tiers — chaoss-free, chaoss-pro, chaoss-enterprise — with
  invented quotas (1,000 and 100,000 requests/month), invented rate limits and "TBD"/"custom" prices,
  all pointed at the baseURL https://ai.chaoss.io/api. None of it was ever published by CHAOSS, and
  that host is no longer a CHAOSS property. plan_count: 0 is the true value.
maintainers:
