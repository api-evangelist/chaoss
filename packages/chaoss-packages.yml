source: >-
  PyPI JSON metadata endpoints (pypi.org/pypi/<pkg>/json) queried 2026-09-05, the GrimoireLab
  component list at https://chaoss.github.io/grimoirelab/, the CHAOSS GitHub organization
  (https://github.com/chaoss), and the GHCR anonymous tag list for ghcr.io/chaoss/collectoss.
description: >-
  First-party client and toolkit packages published by the CHAOSS project. CHAOSS does not ship
  REST API client SDKs — its software IS the product, distributed as installable Python
  distributions (the GrimoireLab toolchain) and as container images (CollectOSS). Every entry
  below was read from the registry metadata endpoint on 2026-09-05; version and published carry
  the registry's own latest-release values.
notes:
  - >-
    Every GrimoireLab distribution declares Homepage https://chaoss.github.io/grimoirelab/ and is
    GPL-3.0-or-later, which is what establishes first-party authorship — the packages are not
    community re-publications.
  - >-
    CollectOSS has no PyPI distribution. Its README states it is "a Python project distributed via
    container images"; the only published build artifact is the GHCR image.
  - >-
    NO `type: SDKs` pointer is emitted in apis.yml for this file, deliberately. Every package here is
    a component of the GrimoireLab analytics toolchain or the CollectOSS server itself — none of them
    is a client library for the CollectOSS REST API. There is no first-party SDK for that API in any
    language, and claiming one would be a false credit.
  - >-
    Augur packages are deliberately absent. github.com/chaoss/augur was archived with the notice
    "The Augur project is no longer part of CHAOSS. Use CollectOSS instead!"; the `augur` name on
    PyPI (0.1, 2018-01-26) is an unrelated third-party package and must not be attributed to CHAOSS.
