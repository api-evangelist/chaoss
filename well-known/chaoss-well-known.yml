source: >-
  Live unauthenticated HTTPS probes run 2026-09-05 against every host this record knows — the
  registrable domain and its www host, the CollectOSS documentation host, the GrimoireLab
  documentation host, and the retired Augur documentation host.
description: >-
  Discovery-document probe for CHAOSS. RESULT: no /.well-known/ document is served on any CHAOSS
  host. Every path returned 404. Two of the hosts (chaoss.community, www.chaoss.community) answer
  404 with the full WordPress 404 page rather than a bare status body, and docs hosts answer with
  the Read the Docs / GitHub Pages 404 shells — none of these is a document. No WellKnown or
  SecurityTxt pointer is emitted in apis.yml as a result, because a pointer would assert that
  CHAOSS serves a surface it does not.
note: >-
  CHAOSS does publish vulnerability-disclosure policy, but through GitHub Security Advisories in
  SECURITY.md rather than a /.well-known/security.txt. See security/chaoss-vulnerability-disclosure.yml.
