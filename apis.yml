aid: chaoss
name: CHAOSS
kind: opensource
description: >-
  CHAOSS (Community Health Analytics in Open Source Software) is a Linux
  Foundation project that develops metrics, methodologies, software, and
  practitioner guides for measuring and improving open source community
  health and sustainability. It maintains a metrics catalog organized into
  focus areas (Common, DEI, Risk, Value, Evolution) plus metrics models,
  and ships the open source software that computes them: CollectOSS, a
  Python data-collection tool that stores forge data in PostgreSQL and
  exposes a 137-operation REST API of CHAOSS-aligned metrics, and
  GrimoireLab, a Python toolchain and OpenSearch dashboard that ingests
  30+ data sources. Both are self-hosted — CHAOSS operates no hosted API
  and sells nothing. CHAOSS also runs the DEI Project Badging program and
  publishes practitioner guides for OSPOs, maintainers and funders. Augur,
  formerly the CHAOSS reference implementation, left the project in March
  2026 and was superseded by CollectOSS.
