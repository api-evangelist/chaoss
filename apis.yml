apis:
- aid: chaoss:metrics-catalog
  name: CHAOSS Metrics Catalog
  description: >-
    The CHAOSS Metrics catalog is a community-maintained, structured reference of community-health metrics
    organized into focus areas (Common, DEI, Risk, Value, Evolution) plus metrics models that compose
    them. The catalog is openly licensed and published on the CHAOSS website. The chaoss/metrics repository
    was archived and the working groups now maintain the definitions; the catalog is consumed by CollectOSS,
    GrimoireLab and third-party implementations.
  humanURL: https://www.chaoss.community/kb-metrics-and-metrics-models/
  tags:
  - Catalog
  - Documentation
  - Metrics
  - Models
  properties:
  - type: Documentation
    url: https://chaoss.community/kbtopic/all-metrics/
  - type: GitHubRepository
    url: https://github.com/chaoss/wg-metrics-models
  - type: GitHubRepository
    url: https://github.com/chaoss/community
- aid: chaoss:grimoirelab
  name: CHAOSS GrimoireLab
  description: >-
    GrimoireLab is an open source platform for software development analytics. It pulls data from 30+
    data sources (Git, GitHub, GitLab, mailing lists, IRC, Slack, Jira, Bugzilla, etc.) and provides a
    Python toolkit (Perceval, Sortinghat, GrimoireELK) plus a Kibana-based dashboard, exposing CHAOSS
    metrics for community health analysis.
  humanURL: https://chaoss.github.io/grimoirelab/
  tags:
  - Analytics
  - Data Pipeline
  - GrimoireLab
  - Kibana
  - Metrics
  properties:
  - type: Documentation
    url: https://chaoss.github.io/grimoirelab/
  - type: GitHubRepository
    url: https://github.com/chaoss/grimoirelab
