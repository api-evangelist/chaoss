apis:
  - aid: chaoss:collectoss-api
    name: CollectOSS REST API
    description: >-
      CollectOSS (pronounced "collect us") is the CHAOSS reference data
      collection and storage tool for open source community health. It
      harvests data from GitHub and GitLab forges into a PostgreSQL
      schema and exposes a Flask/Gunicorn REST API of 137 operations
      that return CHAOSS-aligned metrics grouped by the CHAOSS focus
      areas — evolution, risk, value, complexity, experimental — plus
      utility, visualization, DEI Badging and OAuth login endpoints. It
      is the successor to Augur, which left the CHAOSS project in March
      2026; CollectOSS is self-hosted, so each deployment serves the API
      from its own host under /api/unstable/.
    humanURL: https://docs.collectoss.org/en/latest/
    baseURL: https://collectoss.example.com/api/unstable
    tags:
      - CHAOSS Metrics
      - CollectOSS
      - Community Health
      - Metrics
      - REST
      - Self-Hosted
    properties:
      - type: OpenAPI
        url: openapi/chaoss-collectoss-openapi.yml
      - type: Overlay
        url: overlays/chaoss-collectoss-overlay.yaml
      - type: Documentation
        url: https://docs.collectoss.org/en/latest/
      - type: APIReference
        url: https://docs.collectoss.org/en/latest/rest-api/api.html
      - type: GitHubRepository
        url: https://github.com/chaoss/CollectOSS
      - type: Authentication
        url: authentication/chaoss-authentication.yml
      - type: ErrorCatalog
        url: errors/chaoss-problem-types.yml
      - type: DataModel
        url: data-model/chaoss-data-model.yml
      - type: X-MCPServerCandidate
        url: mcp/chaoss-mcp.yml
      - type: AgentSkill
        url: skills/_index.yml
  - aid: chaoss:metrics-catalog
    name: CHAOSS Metrics Catalog
    description: >-
      The CHAOSS Metrics catalog is a community-maintained, structured
      reference of community-health metrics organized into focus areas
      (Common, DEI, Risk, Value, Evolution) plus metrics models that
      compose them. The catalog is openly licensed and published on the
      CHAOSS website. The chaoss/metrics repository was archived and the
      working groups now maintain the definitions; the catalog is
      consumed by CollectOSS, GrimoireLab and third-party
      implementations.
    humanURL: https://www.chaoss.community/kb-metrics-and-metrics-models/
    tags:
      - Catalog
      - Documentation
      - Metrics
      - Models
    properties:
      - type: Documentation
        url: https://chaoss.community/kbtopic/all-metrics/
      - type: GitHubRepository
        url: https://github.com/chaoss/wg-metrics-models
      - type: GitHubRepository
        url: https://github.com/chaoss/community
  - aid: chaoss:grimoirelab
    name: CHAOSS GrimoireLab
    description: >-
      GrimoireLab is an open source platform for software development
      analytics. It pulls data from 30+ data sources (Git, GitHub,
      GitLab, mailing lists, IRC, Slack, Jira, Bugzilla, etc.) and
      provides a Python toolkit (Perceval, Sortinghat, GrimoireELK) plus
      a Kibana-based dashboard, exposing CHAOSS metrics for community
      health analysis.
    humanURL: https://chaoss.github.io/grimoirelab/
    tags:
      - Analytics
      - Data Pipeline
      - GrimoireLab
      - Kibana
      - Metrics
    properties:
      - type: Documentation
        url: https://chaoss.github.io/grimoirelab/
      - type: GitHubRepository
        url: https://github.com/chaoss/grimoirelab
  - aid: chaoss:8knot
    name: CHAOSS 8Knot Dashboard
    description: >-
      8Knot is an open source community analytics dashboard built on top
      of Augur that provides ready-made visualizations of CHAOSS metrics
      for stakeholders evaluating open source project health.
    humanURL: https://github.com/oss-aspen/8knot
    tags:
