  /repo-groups/:repo_group_id/aggregate-summary:
    get:
      description: Returns the current count of watchers, stars, and forks and the counts of all commits, committers, and pull requests merged between a given beginning and end date (default between now and 365 days ago).
      operationId: Aggregate Summary (Repo Group)
      parameters:
      - description: Repository Group ID.
        in: path
        name: repo_group_id
        schema:
          type: string
        type: string
      - description: 'Beginning date specification. E.g. values: 2018, 2018-05, 2019-05-01'
        in: path
        name: begin_date
        schema:
          type: string
        type: string
      - description: 'Ending date specification. E.g. values: 2018, 2018-05, 2019-05-01'
        in: path
        name: end_date
        schema:
          type: string
        type: string
      responses:
        '200':
          description: OK
          schema:
            items:
              properties:
                commit_count:
                  description: 'Example: 7890143'
                  type: integer
                committer_count:
                  description: 'Example: 8553'
                  type: integer
                fork_count:
                  description: 'Example: 226841'
                  type: integer
                merged_count:
                  description: 'Example: 3883'
                  type: integer
                star_count:
                  description: 'Example: 460447'
                  type: integer
                watcher_count:
