      parameters:
      - description: Repository Group ID
        in: path
        name: repo_group_id
        schema:
          type: string
        type: string
      responses:
        '200':
          description: OK
          schema:
            items:
              properties:
                forks:
                  description: 'Example: 4'
                  type: integer
                repo_id:
                  description: 'Example: 21364'
                  type: integer
                repo_name:
                  description: 'Example: irs_process_scripts'
