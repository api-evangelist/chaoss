        name: end_date
        schema:
          type: string
        type: string
      responses:
        '200':
          description: OK
          schema:
            items:
              properties:
                count:
                  description: 'Example: 1'
                  type: integer
                date:
                  description: 'Example: 2018-10-25T00:00:00.000Z'
                  type: string
                repo_name:
                  description: 'Example: weasel'
                  type: string
                rg_name:
                  description: 'Example: Comcast'
                  type: string
            type: array
      tags:
      - Risk
      summary: Committers (repo)
      x-summary-source: derived
  /repo-groups/:repo_group_id/fork-count:
    get:
      description: A technical fork is a distributed version control copy of a project. The number of technical forks indicates the number of copies of a project on the same code development platform.
      externalDocs:
