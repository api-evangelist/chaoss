openapi: 3.2.0
info:
  title: CollectOSS REST Risk API
  version: 0.60.0
host: example.com
basePath: /api/unstable/
tags:
- name: Risk
paths:
  /metadata/repo_info:
    get:
      description: Returns the metadata about all repositories in a CollectOSS instance, using information from a git platform (GitHub, GitLab, etc.). Each record includes the default branch, forks, stars, watchers, and committers. Also includes metadata about current repository issue and pull request status and counts.
      operationId: Activity Metadata (Repo)
      responses:
        '200':
          description: OK
          schema:
            items:
              properties:
                repo_git:
                  description: 'Example: https://github.com/chaoss/collectoss'
                  type: string
                repo_name:
                  description: 'Example: collectoss'
                  type: string
                repo_id:
                  description: 'Example: 25540'
                  type: integer
                default_branch:
                  description: 'Example: Main'
                  type: string
                license:
                  description: 'Example: MIT'
                  type: string
                fork_count:
                  description: 'Example: 554'
                  type: integer
                watchers_count:
                  description: 'Example: 424'
                  type: integer
                stars_count:
                  description: 'Example: 443'
                  type: integer
                commits_count:
                  description: '4434'
                  type: integer
                committers_count:
                  description: 'Example: 42'
                  type: integer
                open_issues:
                  description: 'Example: 7'
                  type: integer
                issues_count:
                  description: 'Example: 23332'
                  type: integer
                issues_closed:
                  description: 'Example: 23322'
                  type: integer
                pull_request_count:
                  description: 'Example: 19445'
                  type: integer
                pull_requests_open:
                  description: 'Example: 10'
                  type: integer
                pull_requests_closed:
                  description: 'Example: 19435'
                  type: integer
                pull_requests_merged:
                  description: 'Example: 17473'
                  type: integer
            type: array
      tags:
      - Risk
      summary: Activity metadata (repo)
      x-summary-source: derived
  /metadata/contributions_count:
    get:
      description: 'Returns a list of repositories contributed to by all the contributors in a CollectOSS Instance: INCLUDING all repositories on a platform, *not* merely those repositories in the CollectOSS Instance. Numerical totals represent total CONTRIBUTIONS.'
      externalDocs:
        description: CHAOSS Metric Definition
        url: https://chaoss.community/kb/metric-contributors/
      operationId: Contributions Count (Repo)
      responses:
        '200':
          description: OK
          schema:
            items:
              properties:
                repo_git:
                  description: 'Example: https://github.com/chaoss/collectoss'
                  type: string
                contributions:
                  description: 'Example: 43301'
                  type: integer
            type: array
      tags:
      - Risk
      summary: Contributions count (repo)
      x-summary-source: derived
  /metadata/contributors_count:
    get:
      description: 'Returns a list of repositories contributed to by all the contributors in a CollectOSS Instance: INCLUDING all repositories on a platform, *not* merely those repositories in the CollectOSS Instance. Numerical totals represent total CONTRIBUTORS.'
      externalDocs:
        description: CHAOSS Metric Definition
        url: https://chaoss.community/kb/metric-contributors/
      operationId: Contributors Count (Repo)
      responses:
        '200':
          description: OK
          schema:
            items:
              properties:
                repo_git:
                  description: 'Example: https://github.com/chaoss/collectoss'
                  type: string
                contributors:
                  description: 'Example: 77'
                  type: integer
            type: array
      tags:
      - Risk
      summary: Contributors count (repo)
      x-summary-source: derived
  /repo-groups/:repo_group_id/average-issue-resolution-time:
    get:
      description: The average issue resolution time.
      externalDocs:
        description: CHAOSS Metric Definition
        url: https://chaoss.community/kb/metric-issue-resolution-duration/
      operationId: Average Issue Resolution Time (Repo Group)
      parameters:
      - description: Repository Group ID
        in: path
        name: repo_group_id
        schema:
          type: string
        type: string
      responses:
        '200':
          description: OK
          schema:
            items:
              properties:
                avg_issue_resolution_time:
                  description: 'Example: 1413 days 15:39:48'
                  type: string
                repo_id:
                  description: 'Example: 21353'
                  type: integer
                repo_name:
                  description: 'Example: open_id_authentication'
                  type: string
            type: array
      tags:
      - Risk
      summary: Average issue resolution time (repo group)
      x-summary-source: derived
  /repos/:repo_id/average-issue-resolution-time:
    get:
