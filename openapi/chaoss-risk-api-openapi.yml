        url: https://chaoss.community/kb/metric-issue-resolution-duration/
      operationId: Average Issue Resolution Time (Repo)
      parameters:
      - description: Repository ID.
        in: path
        name: repo_id
        schema:
          type: string
        type: string
      responses:
        '200':
          description: OK
          schema:
            items:
              properties:
