openapi: 3.2.0
info:
  title: CollectOSS REST Complexity API
  version: 0.60.0
host: example.com
basePath: /api/unstable/
tags:
- name: complexity
paths:
  /complexity/project_lines:
    get:
      description: Returns project line data for all repositories in a CollectOSS instance, using information from a git platform (GitHub, GitLab, etc.). Each record includes the total and average number of lines in the project repository.
      operationId: Total Lines (repo)
      parameters:
      - in: query
        name: repo_id
        required: true
        schema:
          type: integer
        type: integer
        description: Repository Id
      responses:
        '200':
          description: OK
          schema:
            items:
              properties:
                repo_id:
                  description: 'Example: 25540'
                  type: integer
                repo_git:
                  description: 'Example: https://github.com/chaoss/collectoss'
                  type: string
                repo_name:
                  description: 'Example: collectoss'
                  type: string
                total_lines:
                  description: 'Example: 274734'
                  type: integer
                average_lines:
                  description: 'Example: 1000'
                  type: integer
            type: array
      tags:
      - complexity
      summary: Total lines (repo)
      x-summary-source: derived
  /complexity/project_file_complexity:
    get:
      description: Returns project file complexity data for all repositories in an CollectOSS instance, using information from a git platform (GitHub, GitLab, etc.). Each record includes the total and average file complexity of the project repository.
      operationId: File Complexity (repo)
      responses:
        '200':
          description: OK
          schema:
            items:
              properties:
                repo_id:
                  description: 'Example: 25540'
                  type: integer
                repo_git:
                  description: 'Example: https://github.com/chaoss/collectoss'
                  type: string
                repo_name:
                  description: 'Example: collectoss'
                  type: string
                sum_code_complexity:
                  description: 'Example: 0'
                  type: integer
                average_code_complexity:
                  description: 'Example: 0'
                  type: integer
            type: array
      tags:
      - complexity
      summary: File complexity (repo)
      x-summary-source: derived
  /complexity/project_blank_lines:
    get:
      description: Returns project blank line data for all repositories in a CollectOSS instance, using information from a git platform (GitHub, GitLab, etc.). Each record includes the total and average number of blank lines in the project repository.
      operationId: Total Blank Lines (repo)
      parameters:
      - in: query
        name: repo_id
        required: true
        schema:
          type: integer
        type: integer
        description: Repository Id
      responses:
        '200':
          description: OK
          schema:
            items:
              properties:
