      summary: Total comment lines (repo)
      x-summary-source: derived
  /complexity/project_files:
    get:
      description: Returns project file data for all repositories in a CollectOSS instance, using information from a git platform (GitHub, GitLab, etc.). Each record includes the total number of files in the project repository.
      operationId: Total Files (repo)
      responses:
        '200':
          description: OK
          schema:
            items:
              properties:
                repo_id:
                  description: 'Example: 25540'
