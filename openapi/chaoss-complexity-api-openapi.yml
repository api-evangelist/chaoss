                  description: 'Example: https://github.com/chaoss/collectoss'
                  type: string
                repo_name:
                  description: 'Example: collectoss'
                  type: string
                blank_lines:
                  description: 'Example: 274734'
                  type: integer
                avg_blank_lines:
                  description: 'Example: 923'
                  type: integer
            type: array
      tags:
      - complexity
      summary: Total blank lines (repo)
      x-summary-source: derived
  /complexity/project_comment_lines:
    get:
      description: Returns project comment line data for all repositories in a CollectOSS instance, using information from a git platform (GitHub, GitLab, etc.). Each record includes the total and average number of comment lines in the project repository.
      operationId: Total Comment Lines (repo)
      parameters:
      - in: query
        name: repo_id
        required: true
        schema:
