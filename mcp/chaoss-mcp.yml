  here is callable today and no endpoint is asserted.
deployment:
  mode: none
  endpoint: null
  install: null
  package: null
  auth: unknown
  verified: derived
  note: >-
    mode is `none` because no server exists to reach. Note also that even a future CollectOSS MCP
    server could not be a single hosted endpoint the way a SaaS vendor's is: CollectOSS is
    self-hosted, so every deployment would run its own server against its own instance and its own
    repo_id space. `auth: unknown` follows from that — see authentication/chaoss-authentication.yml,
    where the OAuth authorization server is the CollectOSS instance itself.
